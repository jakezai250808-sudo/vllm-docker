worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';

  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_max_body_size ${MAX_BODY_SIZE};

  # 基础限流（按客户端 IP）
  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=${RATE_LIMIT_RPS};

  map $http_authorization $auth_ok {
    default 0;
    "Bearer ${API_KEY}" 1;
  }

  upstream vllm_backend {
    server ${INFERENCE_UPSTREAM};
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
